.box {
    background: rgba(255, 255, 255, 0.97);

.box header {
    text-align: center;

.form-group {
    margin-bottom: 15px;

    width: 100%;

.gender-group, .education-group {
    display: flex;
    flex-direction: row;

    margin-top: 5px;
}

.gender-group label , .education-group label{
    font-weight: normal;
    display: flex;
    flex-direction: row;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;

<label><input type="radio" name="gender" value="other"> other</label>

<label><input type="checkbox" name="education" value="UG/PG"> UG/PG</label>

<button type="submit">Submit</button>

</form>

function check_uname() {
    let name = document.getElementById("name").value.trim();
    let uname = document.getElementById("uname");

    uname.innerText = "";

    if (name === "") {
        uname.innerText = "Name is required";
        return false;
    }
    else if (name.length < 3) {
        uname.innerText = "Minimum 3 characters required";
        return false;
    }

    return true;
}

function check_Email() {
    let email = document.getElementById("email").value.trim();
    let uemail = document.getElementById("uemail");

    uemail.innerText = "";

    let re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
        uemail.innerText = "Email is required";
        return false;
    }
    else if (!re.test(email)) {
        uemail.innerText = "Invalid email format";
        return false;
    }

    return true;
}

function check_Age() {
    let age = document.getElementById("age").value;
    let uage =document.getElementById("uage");
    uage="";
    if (age === "")
    {
        uage.innerText="age is required"
    } 
    else if(age < 1 || age > 120) {
        uage.innerText="Invalid age";
        return false;
    }

    return true;
}

function check_Gender() {
    let gender = document.querySelector('input[name="gender"]:checked');
    let ugender = document.getElementById("ugender")
    ugender.innerText="";
    if (!gender) {
        ugender.innertext="gender is required";
        return false;
    }

    return true;
}

function check_Phone() {
    let phone = document.getElementById("phone").value.trim();
    let pattern = /^[6-9][0-9]{9}$/;
    let uphone = document.getElementById("uphone")
    uphone.innerText="";
    if (phone === "")
    {
        uphone.innerText="phone no. is required";
        return false;
    }
    else if(!pattern.test(phone)) {
       uphone.innerText="invalid phone no."
        return false;
    }

    return true;
}

function check_DOB() {
    let dob = document.getElementById("dob").value;

    if (dob === "") {
        alert("Select date of birth");
        return false;
    }

    return true;
}

function check_Password() {
    let password = document.getElementById("password").value;

    if (password === "" || password.length < 6) {
        alert("Password must be at least 6 characters");
        return false;
    }

    return true;
}

function check_Education() {
    let education = document.querySelectorAll('input[name="education"]:checked');

    if (education.length === 0) {
        alert("Select at least one education option");
        return false;
    }

    return true;
}

function validateForm() {
    let v1 = check_uname();
    let v2 = check_Email();
    let v3 = check_Age();
    let v4 = check_Gender();
    let v5 = check_Phone();
    let v6 = check_DOB();
    let v7 = check_Password();
    let v8 = check_Education();

    return v1 && v2 && v3 && v4 && v5 && v6 && v7 && v8;
}
